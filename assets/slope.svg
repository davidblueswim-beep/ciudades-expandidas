<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Ilustración de pendiente">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#9ec9ff"/>
      <stop offset="100%" stop-color="#6aa6ff"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- pendiente: un rectángulo rotado -->
  <g transform="translate(0,60)">
    <polygon points="0,220 520,40 600,40 600,260 0,260" fill="url(#g2)" opacity="0.95" />
    <line x1="40" y1="240" x2="520" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- pequeño icono de silla (estilizado) -->
  <g transform="translate(140,140) scale(0.7) rotate(-18)">
    <!-- ruedas -->
    <circle cx="90" cy="90" r="22" fill="#222"/>
    <circle cx="30" cy="30" r="14" fill="#222"/>
    <circle cx="90" cy="90" r="16" fill="#fff"/>
    <circle cx="30" cy="30" r="8" fill="#fff"/>
    <!-- asiento y respaldo -->
    <rect x="40" y="10" width="60" height="12" rx="3" fill="#222" />
    <rect x="70" y="-18" width="10" height="40" rx="3" fill="#222" />
    <!-- estructura -->
    <line x1="48" y1="20" x2="78" y2="74" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <line x1="78" y1="74" x2="98" y2="74" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- etiqueta decorativa -->
  <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#444">Pendiente</text>
</svg>